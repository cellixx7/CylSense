[package]
name = "cyl-sense"
version = "0.1.0"
description = "CYL Sense - coaching inteligente para gamers"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cyl_sense_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
